- name: _validate_final_project_yaml
  kind: method
  receiver: ReleaseManager
  decorators: []
  description: 'Validates the project.yaml against the project.schema.yaml. Note:
    `compiler_settings.meta_schema_file` (e.g. md.meta.schema.yaml) is the meta-schema
    for *documentation/schema* metadata blocks (used by run_validation), not for project.yaml
    itself. project.yaml''s own structure is always validated against the fixed `project.schema.yaml`,
    which is a plain JSON Schema (no top-level ''spec'' wrapper).'
  references:
  - .releaselib.exceptions.ReleaseError
  - .schemalib.validator.ValidationFailureError
  - jsonschema.ValidationError
  - .releaselib.exceptions.ConfigurationError
  - jsonschema.validate
  - .schemalib.loader.load_yaml
  - .schemalib.loader.load_and_resolve_schema
  calls:
  - .releaselib.exceptions.ConfigurationError
  - .releaselib.exceptions.ReleaseError
  - .schemalib.loader.load_and_resolve_schema
  - .schemalib.loader.load_yaml
  - .schemalib.validator.ValidationFailureError
  - instance.get
  - jsonschema.validate
  - self._path
- name: _execute_developer_preparation_phase
  kind: method
  receiver: ReleaseManager
  decorators: []
  description: 'Handles the developer preparation phase: creates release branch, updates
    project.yaml, commits.'
  references:
  - .releaselib.exceptions.ReleaseError
  - .schemalib.loader.write_yaml
  - yaml.dump
  - .schemalib.loader.load_yaml
  - .schemalib.artifact.build_signing_payload
