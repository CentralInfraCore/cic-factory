  - .releaselib.exceptions.ReleaseError
  - .schemalib.artifact.build_signing_payload
  - .schemalib.artifact.compute_spec_checksum
  - .schemalib.loader.load_and_resolve_schema
  - .schemalib.loader.load_yaml
  - .schemalib.loader.write_yaml
  - _parse_certificate_info
  - project_data.get
  - self._path
  - source_data.get
  - yaml.dump
- name: _resign_with_build_hash
  kind: method
  receiver: ReleaseManager
  decorators: []
  description: 'Re-signs project.yaml metadata so the Vault signature also covers
    metadata.buildHash (wasm-template-plan.md, sec. 2.2/a — option (a)): a single
    signature binds source-spec checksum + binary buildHash together (provenance +
    integrity in one signature).'
  references:
  - .schemalib.loader.write_yaml
  - .schemalib.artifact.to_canonical_json
  - .schemalib.loader.load_yaml
  calls:
  - .schemalib.artifact.to_canonical_json
  - .schemalib.loader.load_yaml
  - .schemalib.loader.write_yaml
  - metadata.get
  - project_data.get
- name: _execute_finalization_phase
  kind: method
  receiver: ReleaseManager
  decorators: []
  description: 'Handles the finalization phase: validates project.yaml, commits, tags,
    merges, and cleans up.'
  references: []
  calls:
  - self._path
  - self._resign_with_build_hash
  - self._validate_final_project_yaml
- name: run_release_close
  kind: method
  receiver: ReleaseManager
  decorators: []
  description: Orchestrates the release process based on the current Git branch and
    dry_run status.
  references:
  - .releaselib.exceptions.GitStateError
  - .releaselib.exceptions.VaultServiceError
  calls:
  - .releaselib.exceptions.GitStateError
  - .releaselib.exceptions.VaultServiceError
  - self._check_base_branch_and_version
  - self._execute_developer_preparation_phase
  - self._execute_finalization_phase
- name: run_validation
  kind: method
  receiver: ReleaseManager
  decorators: []
  description: Runs offline validation on the canonical source schema.
  references:
  - .releaselib.exceptions.ReleaseError
  - jsonschema.ValidationError
  - .releaselib.exceptions.ConfigurationError
  - .schemalib.loader.load_and_resolve_schema
  calls:
  - .releaselib.exceptions.ReleaseError
  - .schemalib.loader.load_and_resolve_schema
  - self._path
  - source_data.get
