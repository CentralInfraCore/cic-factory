---
module: read-pk
description: 'Harness reader for the phase 0 positive-control run (pk-canary-channels).
  read-pk.py DIR --expect-repo OWNER/REPO --expect-run-id ID --expect-attempt N              --expect-head-sha
  SHA --expect-sha256 HEX   evaluate fetched evidence read-pk.py --write-manifest
  DIR RUN_JSON OWNER/REPO HEAD ATTEMPT PREV_JSON ARTIFACTS_JSON ZIP_SHA256 (used by
  fetch-pk.sh) validate the run and bind the fetched files to it read-pk.py --check-run
  RUN_JSON OWNER/REPO HEAD ATTEMPT PREV_JSON (used by fetch-pk.sh) refuse a wrong
  run read-pk.py --pick-artifact RUN_JSON ARTIFACTS_JSON HEAD    (used by fetch-pk.sh)
  print the id of THE artifact created inside the attempt window read-pk.py --attach-summary
  DIR FILE RUN_ID ATTEMPT        bind an owner-copied job summary to the run AND the
  attempt the owner names read-pk.py --selftest                                      the
  reader must accept a good fixture and reject every planted defect (it can fail)
  DIR is produced by fetch-pk.sh (a NEW directory per run) and holds: manifest.json
  (run id, attempt, head SHA, event, branch, conclusion, SHA-256 of every fetched
  file), log.txt, annotations.json, artifact/pk-artifact.txt, and optionally summary.txt
  (the job summary is not read through the API; it exists only if the owner copied
  it and bound it with --attach-summary; absent = NOT-READ, never a pass). Per-check
  result: MET / NOT-MET / NOT-READ. These describe the MEASURING INSTRUMENT only (positive
  controls); they are not verdicts on the platform property and not measurement results
  of H1/H2. PK MET needs ALL of: manifest bound to the owner-chosen repository, run
  id and ATTEMPT (--expect-repo, --expect-run-id, --expect-attempt: independent inputs;
  one head SHA can have several runs and one run id several attempts: a web approval
  of a held run makes attempt 2) and to the approved head SHA (--expect-head-sha),
  the expected secret digest (--expect-sha256) compared, every channel read and free
  of any other CANARY-212- value. A missing expectation is INCOMPLETE, never MET.'
