schema_version: "1.0"

# Identification
job_id: "oci-instance-lifecycle-coverage"
parent_job_id: "oci-lifecycle-role-bridge"

# Hierarchy level
level: "repo"
target:
  repo: "cic-module-oracle-cloud"
  path: "module"

# KB context
# NOTE: chunk ids are NOT stable identifiers — the cic-graph KB was re-indexed on
# 2026-08-02 and the older anchor ids now resolve to unrelated symbols. The ids
# below were content-verified on 2026-08-03.
kb_focus:
  - "c1719"
  - "c1734"
promptmap_ref: ""

# Agent
# Model rationale: mostly mechanical — generate a schema the pipeline already
# resolves correctly, embed it, and write two harness tests against an existing
# pattern. The judgement is in what Invoke can honestly be tested against, which
# is a scoping question the spec already frames.
agent:
  config_dir: "~/.claude-personal/agents/cic-module-wasm-claude"
  model: "claude-sonnet-5"
  # Measured, not guessed: four implementation jobs hit ceilings I set today
  # (50, 70, 150, 150). The observed shape is 150-250 turns, because an
  # implementation turn is a compile-run-read cycle, not a read.
  max_turns: "250"
  session_id: ""

# Workplace
workplace:
  repos:
    - "cic-factory"
    - "cic-module-oracle-cloud"
  branch: "feature/oci-instance-lifecycle-coverage"

# Status
status: "running"
