- name: CanonicalObject
  kind: interface
  description: 'CanonicalObject is Validated<Canonical<CICObject>> (SPEC INV-032):
    the type of a module''s input, and the only thing that may cross the module boundary
    of SPEC §9. The unexported method is the enforcement. No package outside this
    one can implement the interface, so no package outside this one can produce a
    value of the type — "an invalid object has no representation that crosses the
    boundary" rather than "validate before you call". The residual hole is the nil
    interface value, which Go cannot forbid; a module boundary therefore still rejects
    nil explicitly (see ../module).'
  references: []
