- name: Materialize
  kind: func
  description: 'Materialize runs the pipeline of SPEC §8 and is the only producer
    of a CanonicalObject. The stages run in the order SPEC §8 fixes, and each is a
    separate function over the previous one''s output: a later stage cannot observe
    input an earlier stage would have rejected, which is what makes the `stage:` field
    of every expected-error.yaml meaningful.'
  references: []
  calls:
  - LoadSchema
  - Sprintf
  - Unmarshal
- name: ValidateCanonicalDocument
  kind: func
  description: 'ValidateCanonicalDocument is SPEC §8.7 applied directly to an already-canonical
    object. conformance/validation/* needs this entry point: truth-table rows 7 and
    8 cannot be produced by any authoring input, because origin may not be authored
    at all (INV-007). They are reachable only as a materializer defect or a hand-forged
    object, so without a schema-free validation entry point two rows of the table
    would be unfalsifiable.'
  references: []
  calls:
  - Sprintf
  - Unmarshal
