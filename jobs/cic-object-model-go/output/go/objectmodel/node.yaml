- name: Node
  kind: struct
  description: 'Node is a CIC node (SPEC §2.1): exactly one `values` member (INV-001)
    and, in canonical form, exactly one `origin` member (INV-002), plus one member
    per primitive its schema declares (INV-022). Every field is unexported and there
    is no exported constructor, so a Node can only come out of Materialize. That is
    half of INV-032; CanonicalObject in materialize.go is the other half.'
