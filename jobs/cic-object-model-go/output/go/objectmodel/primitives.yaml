- name: normalizePrimitive
  kind: func
  description: 'normalizePrimitive turns a declared primitive payload into its canonical
    form. Only `access` has a form SPEC fixes (§6.4); everything else is carried through
    as declared. Note what is NOT done here: the payload is not materialized into
    CIC nodes. SPEC §2.2 motivates the model with "network.values.mtu.access.read
    is a first-class, addressable object", and INV-027 says a schema-known structured
    object must be recursively materialized — but every vector keeps primitive payloads
    as plain mappings. docs/spec-defects.md SD-003.'
