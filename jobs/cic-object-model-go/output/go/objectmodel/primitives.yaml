- name: evaluatePrimitives
  kind: func
  description: 'evaluatePrimitives is SPEC §8.6. INPUT:  node tree with values materialized
    OUTPUT: node tree with every schema-declared primitive materialized as a node
    MUST:   materialize every declared primitive (INV-022); resolve `inherit` chains
    for `access` (INV-025) MUST NOT: admit an unknown primitive (INV-021) The `inherit`
    chain resolution this stage is told to perform is not implemented, and cannot
    be in 0.1: INV-025''s tri-state resolves against the PolicySurface, which SPEC
    §1 puts out of scope. materialization/013 records `inherit` verbatim rather than
    resolved, so no vector requires resolution either. Recorded as docs/spec-defects.md
    SD-012 — a normative MUST with no reachable semantics, not an omission this implementation
    chose.'
  references: []
