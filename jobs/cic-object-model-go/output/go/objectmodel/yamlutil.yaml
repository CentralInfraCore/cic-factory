- name: orderedMap
  kind: struct
  description: orderedMap is a mapping with an explicit key order. SPEC INV-030 requires
    a byte-identical canonical object for the same schema and input, but SPEC §8.8
    never defines the canonical key order (or indent, or scalar style). This implementation
    defines one — node members in the order values, origin, then primitives in SPEC
    §6.1 declaration order; payload mappings sorted — and records the gap as docs/spec-defects.md
    SD-010.
