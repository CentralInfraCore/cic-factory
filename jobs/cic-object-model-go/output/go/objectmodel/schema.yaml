- name: primitiveSet
  kind: var
  description: primitiveSet is the eight irreducible atoms (SPEC §6.1). The order
    is the order SPEC §6.1 states them in, and it is also the canonical member order
    of a node (see canonical.go). D-003 was amended on 2026-05-04 to absorb D-011
    and now says eight, not seven; the KB snapshot chunk c4255 still says seven. SPEC
    §6.1 is the authority here and it says eight.
  references: []
- name: schemaKeywords
  kind: var
  description: 'schemaKeywords are the non-primitive keys of the vector schema language.
    `shape` is both a keyword and a primitive name: it is declared as a keyword (`shape:
