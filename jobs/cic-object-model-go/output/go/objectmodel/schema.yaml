- name: checkPrimitiveCycle
  kind: func
  description: 'checkPrimitiveCycle enforces INV-005. INV-005 is worded as "a primitive''s
    own primitives MUST NOT, directly or transitively, re-declare the node they hang
    from", but the vector schema language is a finite tree with no reference mechanism,
    so no schema written in it can re-declare a node and no materialization written
    against it can fail to terminate. invalid/008_cyclic_primitive_declaration therefore
    tests a different (stronger) property than INV-005 states: acyclicity of the primitive-*name*
    graph. This implementation enforces the property the vector requires and records
    the discrepancy as docs/spec-defects.md SD-005.'
  references: []
  calls:
