parent_job_id: "oci-extract-generalize"

# Hierarchy level
level: "repo"
target:
  repo: "cic-module-oracle-cloud"
  path: "tools/oci-extract"

# KB context
# NOTE: chunk ids are NOT stable identifiers — the cic-graph KB was re-indexed on
# 2026-08-02 and the older anchor ids (c781, c912, c927, c365) now resolve to
# unrelated symbols. The ids below were content-verified on 2026-08-03.
kb_focus:
  - "c1719"
  - "c4147"
promptmap_ref: ""

# Agent
# Model rationale: by the time this runs, oci-extract-generalize has already
# settled the open-ended question (does the extractor survive OCI's
# heterogeneity). What remains is running the proven mechanism at scale,
# recording numbers, and two well-specified engineering pieces (gate
# granularity, embedding measurement). Machine-checkable DoD throughout, so a
# mid-tier model is the right price for the work.
#
# DEPENDENCY: do not start before oci-extract-generalize is merged. This job
# assumes a service-agnostic extractor and reads its sweep-input.md.
agent:
  config_dir: "~/.claude-personal/agents/cic-module-wasm-claude"
  model: "claude-sonnet-5"
  # Raised 70 -> 150 after the first run hit the ceiling at 71/70 with
  # stop_reason tool_use. Second time today an implementation job blew a budget
  # I set: oci-extract-generalize needed ~145 turns across three runs. The
  # level-based defaults in run-job.sh (domain 40, repo 60, orchestrator 80) are
  # calibrated for audit and documentation jobs; a job that writes and iterates
  # on Go code needs multiples of that, because every compile-run-read cycle is
  # a turn.
  max_turns: "150"
  session_id: "fb244b21-ce2e-4137-9c7c-358743d07e0e"

# Workplace
workplace:
  repos:
    - "cic-factory"
    - "cic-module-oracle-cloud"
